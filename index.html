<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Station — Used MacBook & iPhone | Shenzhen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0d0d0d;
  --surface: #181818;
  --card: #1a1a1a;
  --card-hover: #202020;
  --border: #2a2a2a;
  --accent: #c8f542;
  --accent-dark: #a8d030;
  --text: #ffffff;
  --text-dim: #888888;
  --text-muted: #555555;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

/* ── NOTICE BAR ── */
.notice-bar {
  background: rgba(200,245,66,0.07);
  border-bottom: 1px solid rgba(200,245,66,0.12);
  text-align: center;
  padding: 0.5rem 1rem;
  font-size: 0.75rem;
  color: var(--accent);
  font-weight: 500;
}

/* ── TOP NAV ── */
.topnav {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.nav-left { display:flex; align-items:center; gap:2rem; }

.logo {
  display:flex; align-items:center; gap:0.5rem;
  text-decoration:none;
}
.logo-icon {
  width:32px; height:32px;
  background: var(--accent);
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:1rem;
}
.logo-text { font-size:1.1rem; font-weight:700; color:var(--text); letter-spacing:-0.02em; }

.nav-links { display:flex; gap:0.25rem; list-style:none; }
.nav-links a {
  color:var(--text-dim); text-decoration:none;
  font-size:0.82rem; font-weight:500;
  padding:0.4rem 0.75rem; border-radius:6px;
  transition:all 0.15s; cursor:pointer;
}
.nav-links a:hover, .nav-links a.active { color:var(--text); background:var(--surface); }

.nav-center { flex:1; max-width:480px; margin:0 2rem; }
.search-wrap { position:relative; }
.search-wrap input {
  width:100%;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:0.5rem 1rem 0.5rem 2.4rem;
  color:var(--text); font-family:'Inter',sans-serif;
  font-size:0.85rem; outline:none; transition:border-color 0.15s;
}
.search-wrap input:focus { border-color:#444; }
.search-wrap input::placeholder { color:var(--text-muted); }
.search-icon {
  position:absolute; left:0.75rem; top:50%; transform:translateY(-50%);
  color:var(--text-muted); font-size:0.85rem; pointer-events:none;
}

.nav-right { display:flex; align-items:center; gap:0.75rem; }
.nav-icon-btn {
  width:36px; height:36px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:8px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:1rem; transition:background 0.15s; text-decoration:none;
}
.nav-icon-btn:hover { background:var(--card-hover); }

.nav-contact-btn {
  background:var(--accent); color:#000;
  font-size:0.8rem; font-weight:600;
  padding:0.45rem 1rem; border-radius:8px;
  border:none; cursor:pointer; text-decoration:none;
  display:flex; align-items:center; gap:0.4rem;
  transition:background 0.15s;
}
.nav-contact-btn:hover { background:var(--accent-dark); }

/* ── CATEGORY PILLS ── */
.cat-bar {
  background:var(--bg); border-bottom:1px solid var(--border);
  padding:0.75rem 1.5rem;
  display:flex; align-items:center; gap:0.5rem;
  overflow-x:auto; scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar { display:none; }

.cat-pill {
  flex-shrink:0;
  background:#1e1e1e; border:1px solid var(--border);
  color:var(--text-dim); font-size:0.78rem; font-weight:500;
  padding:0.35rem 1rem; border-radius:100px;
  cursor:pointer; transition:all 0.15s; white-space:nowrap;
}
.cat-pill:hover { color:var(--text); border-color:#444; }
.cat-pill.active { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }

/* ── MAIN ── */
.main { max-width:1400px; margin:0 auto; padding:1.5rem; }

/* ── SECTION HEADER ── */
.section-header { margin-bottom:1.25rem; }
.section-title { font-size:0.72rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:0.25rem; }
.section-count { font-size:1.1rem; font-weight:700; color:var(--text); }

/* ── HERO ── */
.hero-banner {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:2.5rem; margin-bottom:2rem;
  display:flex; align-items:center; justify-content:space-between;
  gap:2rem; position:relative; overflow:hidden;
}
.hero-banner::before {
  content:''; position:absolute; right:-60px; top:-60px;
  width:300px; height:300px;
  background:radial-gradient(circle, rgba(200,245,66,0.06) 0%, transparent 70%);
  pointer-events:none;
}
.hero-eyebrow { font-size:0.72rem; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); margin-bottom:0.5rem; }
.hero-h1 { font-size:2rem; font-weight:700; line-height:1.15; letter-spacing:-0.03em; margin-bottom:0.75rem; }
.hero-sub { font-size:0.88rem; color:var(--text-dim); line-height:1.6; max-width:380px; margin-bottom:1.5rem; }
.hero-actions { display:flex; gap:0.75rem; flex-wrap:wrap; }

.btn-primary {
  background:var(--accent); color:#000;
  font-size:0.82rem; font-weight:600;
  padding:0.6rem 1.25rem; border-radius:8px;
  border:none; cursor:pointer; text-decoration:none;
  transition:background 0.15s; display:inline-block;
}
.btn-primary:hover { background:var(--accent-dark); }

.btn-outline {
  background:transparent; color:var(--text-dim);
  font-size:0.82rem; font-weight:500;
  padding:0.6rem 1.25rem; border-radius:8px;
  border:1px solid var(--border); cursor:pointer;
  text-decoration:none; transition:all 0.15s; display:inline-block;
}
.btn-outline:hover { color:var(--text); border-color:#444; background:var(--surface); }

.hero-stats { display:flex; gap:2.5rem; flex-shrink:0; }
.hero-stat { text-align:center; }
.hero-stat-num { font-size:1.6rem; font-weight:700; color:var(--accent); letter-spacing:-0.03em; }
.hero-stat-label { font-size:0.7rem; color:var(--text-dim); margin-top:0.15rem; }

/* ── CAT SHOWCASE ── */
.cat-showcase {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
  gap:0.75rem; margin-bottom:2rem;
}
.cat-showcase-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:10px; padding:1.1rem 0.75rem;
  text-align:center; cursor:pointer; text-decoration:none;
  transition:all 0.15s; display:block;
}
.cat-showcase-card:hover { background:var(--card-hover); border-color:#3a3a3a; }
.cat-showcase-card.active-cat { border-color:var(--accent); background:rgba(200,245,66,0.05); }
.cat-showcase-icon { font-size:1.8rem; margin-bottom:0.5rem; display:block; }
.cat-showcase-name { font-size:0.78rem; font-weight:600; color:var(--text); display:block; }
.cat-showcase-sub { font-size:0.65rem; color:var(--text-dim); margin-top:0.15rem; display:block; }

/* ── PRODUCT GRID ── */
.products-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:1px; background:var(--border);
  border:1px solid var(--border); border-radius:12px; overflow:hidden;
}

.product-card {
  background:var(--card); cursor:pointer;
  transition:background 0.15s; display:flex; flex-direction:column;
  position:relative;
}
.product-card:hover { background:var(--card-hover); }

.product-img-wrap {
  position:relative; width:100%; padding-top:80%;
  background:var(--surface); overflow:hidden;
}
.product-img-inner {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:3.5rem;
}
.product-cat-tag {
  position:absolute; top:0.6rem; left:0.6rem;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  border:1px solid var(--border); color:var(--text-dim);
  font-size:0.6rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
  padding:0.2rem 0.5rem; border-radius:4px;
}
.product-heart {
  position:absolute; top:0.6rem; right:0.6rem;
  width:28px; height:28px;
  background:rgba(0,0,0,0.6); border:1px solid var(--border);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:0.75rem; cursor:pointer; transition:all 0.15s;
}
.product-heart:hover { background:rgba(200,245,66,0.15); border-color:var(--accent); }
.product-grade-badge {
  position:absolute; bottom:0.6rem; right:0.6rem;
  font-size:0.6rem; font-weight:700; letter-spacing:0.05em;
  padding:0.2rem 0.5rem; border-radius:4px;
}
.grade-a { background:rgba(200,245,66,0.15); color:var(--accent); border:1px solid rgba(200,245,66,0.3); }
.grade-b { background:rgba(255,170,50,0.12); color:#ffaa32; border:1px solid rgba(255,170,50,0.25); }
.grade-c { background:rgba(255,80,80,0.12); color:#ff5050; border:1px solid rgba(255,80,80,0.25); }

.product-body { padding:0.85rem; flex:1; display:flex; flex-direction:column; gap:0.4rem; }
.product-name { font-size:0.82rem; font-weight:500; color:var(--text); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.product-rating { display:flex; align-items:center; gap:0.3rem; }
.stars { color:var(--accent); font-size:0.7rem; letter-spacing:0.05em; }
.rating-num { font-size:0.7rem; color:var(--text-dim); }
.product-price { font-size:1rem; font-weight:700; color:var(--accent); margin-top:auto; }
.product-price-sub { font-size:0.72rem; color:var(--text-muted); font-weight:400; }

/* ── NO RESULTS ── */
#no-results {
  display:none; text-align:center; padding:4rem 2rem;
  color:var(--text-dim); font-size:0.88rem;
  grid-column:1 / -1; background:var(--card);
}

/* ── PAGE VIEWS ── */
.page-view { display:none; }
.page-view.active { display:block; }

/* ── CONTACT ── */
.contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; }
.contact-card { background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.contact-card-header { padding:1rem 1.25rem; border-bottom:1px solid var(--border); font-size:0.78rem; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; }
.contact-item { display:flex; align-items:center; gap:1rem; padding:1rem 1.25rem; border-bottom:1px solid var(--border); transition:background 0.15s; cursor:pointer; text-decoration:none; color:inherit; }
.contact-item:last-child { border-bottom:none; }
.contact-item:hover { background:var(--card-hover); }
.contact-item-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
.icon-wa { background:rgba(37,211,102,0.12); }
.icon-wc { background:rgba(9,196,85,0.12); }
.icon-yt { background:rgba(255,0,0,0.1); }
.icon-tt { background:rgba(255,255,255,0.06); }
.icon-ig { background:rgba(200,100,200,0.12); }
.icon-loc { background:rgba(200,245,66,0.1); }
.contact-item-label { font-size:0.68rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.15rem; }
.contact-item-value { font-size:0.88rem; font-weight:600; color:var(--text); }

.qr-grid { display:grid; grid-template-columns:repeat(4,1fr); }
.qr-item { padding:1.25rem 0.75rem; border-right:1px solid var(--border); text-align:center; }
.qr-item:last-child { border-right:none; }
.qr-box { width:64px; height:64px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin:0 auto 0.6rem; display:flex; align-items:center; justify-content:center; font-size:1.6rem; }
.qr-name { font-size:0.72rem; font-weight:600; color:var(--text); }
.qr-handle { font-size:0.65rem; color:var(--text-dim); margin-top:0.1rem; }

.safety-banner { background:rgba(200,245,66,0.05); border:1px solid rgba(200,245,66,0.15); border-radius:10px; padding:1rem 1.25rem; display:flex; align-items:flex-start; gap:0.75rem; margin-top:1rem; }
.safety-icon { font-size:1.2rem; flex-shrink:0; }
.safety-text { font-size:0.82rem; color:var(--text-dim); line-height:1.5; }
.safety-text strong { color:var(--accent); }

/* ── GRADE GUIDE ── */
.grade-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
.grade-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.5rem; }
.grade-letter-big { font-size:2.5rem; font-weight:700; letter-spacing:-0.04em; margin-bottom:0.5rem; }
.grade-card-title { font-size:0.85rem; font-weight:600; color:var(--text); margin-bottom:0.5rem; }
.grade-card-desc { font-size:0.8rem; color:var(--text-dim); line-height:1.6; }

/* ── RESPONSIVE ── */
@media (max-width:768px) {
  .hero-stats { display:none; }
  .hero-h1 { font-size:1.4rem; }
  .contact-grid { grid-template-columns:1fr; }
  .grade-cards { grid-template-columns:1fr; }
  .qr-grid { grid-template-columns:1fr 1fr; }
  .nav-center { display:none; }
  .nav-links { display:none; }
}
</style>
</head>
